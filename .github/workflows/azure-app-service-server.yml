name: Deploy legacy API to Azure App Service

on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: redactor-api # set this to the name of your Azure Web App

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Keep production dependencies
        working-directory: server
        run: npm prune --omit=dev

      - name: Package artifact
        working-directory: server
        run: zip -r ../server-release.zip . -x "test/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-app
          path: server-release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: server-release.zip
