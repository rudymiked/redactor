name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/azure-app-service-server.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: redactor-api # set this to the name of your Azure Web App

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Package artifact
        working-directory: server
        run: zip -r ../server-release.zip . -x "node_modules/*" "test/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-app
          path: server-release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: server-release.zip
